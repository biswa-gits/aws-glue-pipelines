AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Glue Job - _pipeline1 (converted from Azure Data Factory)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  S3BucketName:
    Type: String
    Default: your-glue-bucket
  GlueJobName:
    Type: String
    Default: _pipeline1
  NumberOfWorkers:
    Type: Number
    Default: 2
  WorkerType:
    Type: String
    Default: G.1X
    AllowedValues:
      - Standard
      - G.1X
      - G.2X
      - G.025X

Resources:
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GlueJobName}-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: !Sub "${GlueJobName}-s3-access"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"

  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${GlueJobName}-${Environment}"
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${S3BucketName}/scripts/_pipeline1.py"
        PythonVersion: '3'
      DefaultArguments:
        '--job-language': python
        '--TempDir': !Sub "s3://${S3BucketName}/temp/"
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub "s3://${S3BucketName}/spark-logs/"
      GlueVersion: '4.0'
      NumberOfWorkers: !Ref NumberOfWorkers
      WorkerType: !Ref WorkerType
      Timeout: 120
      MaxRetries: 1

  GlueJobTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "${GlueJobName}-trigger-${Environment}"
      Type: ON_DEMAND
      Actions:
        - JobName: !Ref GlueJob

Outputs:
  GlueJobName:
    Value: !Ref GlueJob
    Description: Name of the Glue Job
  GlueJobRoleArn:
    Value: !GetAtt GlueJobRole.Arn
    Description: ARN of the IAM Role for Glue Job
