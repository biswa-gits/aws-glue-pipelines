# Glue job stack for adf-pipeline1-sink-to-snowflake (from ADF pipeline pipeline1_sink_to_snowflake).
# Requires the shared core stack 'adf-glue-migration-core' to be deployed first.
# 
#   aws cloudformation deploy \
#     --stack-name pipeline1-sink-to-snowflake-glue-job \
#     --template-file cloudformation/pipeline1-sink-to-snowflake-glue-job.yaml \
#     --capabilities CAPABILITY_IAM \
#     --parameter-overrides CoreStackName=adf-glue-migration-core
# 
# Generated by ADF_to_AWS_Glue_App - review before deploying to production.
AWSTemplateFormatVersion: "2010-09-09"
Description: "Glue job adf-pipeline1-sink-to-snowflake, migrated from Azure Data Factory pipeline pipeline1_sink_to_snowflake."
Parameters:
  CoreStackName:
    Type: String
    Default: adf-glue-migration-core
    Description: "Name of the deployed shared core stack whose outputs this job imports."
  GlueJobName:
    Type: String
    Default: adf-pipeline1-sink-to-snowflake
    Description: "Name of the Glue job."
  GlueVersion:
    Type: String
    Default: "4.0"
    AllowedValues:
      - "3.0"
      - "4.0"
      - "5.0"
  WorkerType:
    Type: String
    Default: G.1X
    AllowedValues:
      - G.025X
      - G.1X
      - G.2X
      - G.4X
      - G.8X
    Description: "Step 5: worker size. G.1X = 4 vCPU / 16 GB per worker."
  NumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    Description: "Step 5: worker count (minimum 2 for Spark jobs)."
  TimeoutMinutes:
    Type: Number
    Default: 60
    MinValue: 1
  MaxRetries:
    Type: Number
    Default: 0
    MinValue: 0
  MaxConcurrentRuns:
    Type: Number
    Default: 1
    MinValue: 1
  AttachLeastPrivilegePolicy:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Attach this job's least-privilege policy to the shared role (see iam/)."
  SourcePath:
    Type: String
    Default: s3://BUCKET/prefix/
    Description: "Step 4: S3 prefix containing the source customer files (e.g. s3://bucket/path/)."
  SinkTable:
    Type: String
    Default: DB.SCHEMA.CUSTOMERS
    Description: "Step 4: Snowflake target table name (database.schema.table)."
  SnowflakeSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:region:acct:secret:glue/adf/snowflake
    Description: "Step 4: ARN of the Secrets Manager secret containing Snowflake credentials (user, password, account, role, warehouse, database, host)."
  TempDir:
    Type: String
    Default: s3://BUCKET/tmp/
    Description: "Step 4: S3 temp dir for Glue/Snowflake staging (if required)."
Conditions:
  ShouldAttachJobPolicy:
    Fn::Equals:
      - Ref: AttachLeastPrivilegePolicy
      - "true"
Resources:
  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name:
        Ref: GlueJobName
      Description: "Read customers CSV/Delimited from Azure Blob (migrated to S3), filter CUSTOMER_ID == 'C0011', and write to Snowflake via JDBC using credentials from Secrets Manager."
      Role:
        Fn::ImportValue:
          Fn::Sub: "${CoreStackName}-GlueRoleArn"
      GlueVersion:
        Ref: GlueVersion
      WorkerType:
        Ref: WorkerType
      NumberOfWorkers:
        Ref: NumberOfWorkers
      Timeout:
        Ref: TimeoutMinutes
      MaxRetries:
        Ref: MaxRetries
      ExecutionProperty:
        MaxConcurrentRuns:
          Ref: MaxConcurrentRuns
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation:
          Fn::Sub:
            - "s3://${Bucket}/scripts/${Script}"
            - Bucket:
                Fn::ImportValue:
                  Fn::Sub: "${CoreStackName}-BucketName"
              Script: df_pipeline1_sink_to_snowflake.py
      DefaultArguments:
        "--job-language": python
        "--job-bookmark-option": job-bookmark-disable
        "--enable-metrics": "true"
        "--enable-observability-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-spark-ui": "true"
        "--spark-event-logs-path":
          Fn::Sub:
            - "s3://${Bucket}/spark-logs/${Job}/"
            - Bucket:
                Fn::ImportValue:
                  Fn::Sub: "${CoreStackName}-BucketName"
              Job:
                Ref: GlueJobName
        "--TempDir":
          Fn::Sub:
            - "s3://${Bucket}/temp/${Job}/"
            - Bucket:
                Fn::ImportValue:
                  Fn::Sub: "${CoreStackName}-BucketName"
              Job:
                Ref: GlueJobName
        "--SOURCE_PATH":
          Ref: SourcePath
        "--SINK_TABLE":
          Ref: SinkTable
        "--SNOWFLAKE_SECRET_ARN":
          Ref: SnowflakeSecretArn
        "--TEMP_DIR":
          Ref: TempDir
      Tags:
        Project: adf-glue-migration
        SourceAdfPipeline: pipeline1_sink_to_snowflake
        JobType: glue_pyspark
        ManagedBy: ADF_to_AWS_Glue_App
  JobLeastPrivilegePolicy:
    Type: AWS::IAM::Policy
    Condition: ShouldAttachJobPolicy
    Properties:
      PolicyName: pipeline1-sink-to-snowflake-least-privilege
      Roles:
        - Fn::ImportValue:
            Fn::Sub: "${CoreStackName}-GlueRoleName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ReadSource
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - "arn:aws:s3:::*"
              - "arn:aws:s3:::*/data/*"
          - Sid: S3TempWrite
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - "arn:aws:s3:::*"
              - "arn:aws:s3:::*/scripts/*"
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource:
              - Fn::Sub: "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glue/adf/*"
          - Sid: GlueLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*"
              - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*:*"
Outputs:
  GlueJobName:
    Description: "Name of the created Glue job."
    Value:
      Ref: GlueJob
  StartCommand:
    Description: "Start the job from the CLI."
    Value:
      Fn::Sub: "aws glue start-job-run --job-name ${GlueJobName}"
