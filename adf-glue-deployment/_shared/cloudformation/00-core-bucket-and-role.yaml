# Shared core stack for adf-glue-migration.
# Deploy this ONCE before any per-job stack. Per-job stacks import its outputs.
# 
#   aws cloudformation deploy \
#     --stack-name adf-glue-migration-core \
#     --template-file cloudformation/00-core-bucket-and-role.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides ProjectBucketName=<your-unique-bucket>
# 
# Generated by ADF_to_AWS_Glue_App - review before deploying to production.
AWSTemplateFormatVersion: "2010-09-09"
Description: "Shared core for the adf-glue-migration migration: S3 bucket and Glue service role."
Parameters:
  ProjectBucketName:
    Type: String
    Description: "Globally unique S3 bucket for Glue scripts, data, temp and Spark logs."
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: "Must be a valid lowercase S3 bucket name."
  SecretPrefix:
    Type: String
    Default: glue/adf/
    Description: "Secrets Manager name prefix the Glue jobs may read."
  RoleName:
    Type: String
    Default: adf-glue-migration-glue-service-role
    Description: "Name of the shared Glue service role."
Resources:
  ProjectBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Ref: ProjectBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGlueTempData
            Status: Enabled
            Prefix: temp/
            ExpirationInDays: 7
          - Id: ExpireSparkEventLogs
            Status: Enabled
            Prefix: spark-logs/
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: adf-glue-migration
        - Key: ManagedBy
          Value: ADF_to_AWS_Glue_App
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Description: "Shared execution role for Glue jobs migrated from Azure Data Factory."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowGlueServiceAssumeRole
            Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: adf-migration-baseline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ProjectBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - Fn::Sub: "arn:aws:s3:::${ProjectBucket}"
                  - Fn::Sub: "arn:aws:s3:::${ProjectBucket}/*"
              - Sid: ReadMigrationSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - Fn::Sub: "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretPrefix}*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*"
      Tags:
        - Key: Project
          Value: adf-glue-migration
        - Key: ManagedBy
          Value: ADF_to_AWS_Glue_App
Outputs:
  ProjectBucketName:
    Description: "S3 bucket holding scripts, data, temp and Spark logs."
    Value:
      Ref: ProjectBucket
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-BucketName"
  GlueServiceRoleArn:
    Description: "ARN of the shared Glue service role."
    Value:
      Fn::GetAtt:
        - GlueServiceRole
        - Arn
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-GlueRoleArn"
  GlueServiceRoleName:
    Description: "Name of the shared Glue service role."
    Value:
      Ref: GlueServiceRole
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}-GlueRoleName"
